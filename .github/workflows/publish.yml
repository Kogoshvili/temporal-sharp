name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: |
          dotnet pack src/Temporal.Analyzers/Temporal.Analyzers.csproj --no-build -c Release -o artifacts
          dotnet pack src/Temporal.Cli/Temporal.Cli.csproj --no-build -c Release -o artifacts
          dotnet pack src/Temporal.Configuration/Temporal.Configuration.csproj --no-build -c Release -o artifacts
          dotnet pack src/Temporal.Codec/Temporal.Codec.csproj --no-build -c Release -o artifacts
          dotnet pack src/Temporal.CodecServer/Temporal.CodecServer.csproj --no-build -c Release -o artifacts
          dotnet pack src/Temporal.Cloud/Temporal.Cloud.csproj --no-build -c Release -o artifacts
          dotnet pack src/Temporal.Hosting/Temporal.Hosting.csproj --no-build -c Release -o artifacts
          dotnet pack src/Temporal.Testing/Temporal.Testing.csproj --no-build -c Release -o artifacts
          dotnet pack templates/Temporal.Templates/Temporal.Templates.csproj --no-build -c Release -o artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi
