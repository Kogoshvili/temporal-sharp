name: Update RULES.md

on:
  push:
    branches: [main]
    paths:
      - 'src/Temporal.Analyzers/Diagnostics/DiagnosticDescriptors.cs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Regenerate RULES.md
        run: dotnet run --project src/Temporal.Cli/Temporal.Cli.csproj -- docs

      - name: Commit and push RULES.md if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RULES.md
          if git diff --cached --quiet; then
            echo "RULES.md is up to date."
          else
            git commit -m "Regenerate RULES.md"
            git push
          fi
