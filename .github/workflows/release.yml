name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update CHANGELOG.md
        run: bash scripts/update-changelog.sh "${{ github.event.inputs.version }}"

      # Branch protection on main requires changes to go through a PR, so the
      # changelog commit is opened as a PR, CI-verified, squash-merged, and the
      # tag is placed on the merge commit (keeping changelog + tag in one
      # commit for MinVer).
      - name: Commit changelog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md is up to date."
          else
            git checkout -b "release-prep/v${{ github.event.inputs.version }}"
            git commit -m "Prepare v${{ github.event.inputs.version }} release"
            git push -u origin "release-prep/v${{ github.event.inputs.version }}"
            echo "created_pr=true" >> "$GITHUB_ENV"
          fi

      - name: Create release PR
        if: env.created_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "release-prep/v${{ github.event.inputs.version }}" \
            --title "Prepare v${{ github.event.inputs.version }} release" \
            --body "Automated changelog update for v${{ github.event.inputs.version }}."

      - name: Merge release PR
        if: env.created_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_branch="release-prep/v${{ github.event.inputs.version }}"

          # The changelog PR is authored with this workflow's GITHUB_TOKEN, so
          # GitHub parks its pull_request CI run in action_required until it is
          # approved, and the run itself can take a moment to register. Poll
          # for the run first; "gh pr checks --watch" races startup otherwise.
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --branch "$pr_branch" --workflow ci.yml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::No CI run registered for $pr_branch within 5 minutes."
            exit 1
          fi

          # Approve the parked run; fail loudly rather than merging unverified.
          conclusion=$(gh run view "$run_id" --json conclusion --jq '.conclusion // empty')
          if [ "$conclusion" = "action_required" ]; then
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" >/dev/null 2>&1; then
              echo "Approved CI run $run_id (was waiting for authorization)."
            else
              echo "::error::CI run $run_id is waiting for approval and could not be approved automatically. Approve it at https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id} and re-run."
              exit 1
            fi
          fi

          gh run watch "$run_id" --exit-status
          gh pr merge "release-prep/v${{ github.event.inputs.version }}" --squash --delete-branch

      - name: Tag and push
        run: |
          git fetch origin main --tags --force
          git checkout main
          git pull --ff-only origin main
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Trigger publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "v${{ github.event.inputs.version }}"
